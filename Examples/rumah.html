<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
</head>
<body>
    <div id="contoh_rumah"></div>
    <script>
        new p5(function(p) {
            p.setup = function() {
                p.createCanvas(800, 500);
            };

            p.draw = function() {
                p.background(235)
                p.noStroke();
                
                p.fill(90, 170, 90);
                p.rect(0, 390, 800, 110);

                p.fill(230, 180, 120);
                p.rect(280, 220, 240, 170);

                p.fill(160, 70, 60);
                p.triangle (250, 220, 400, 100, 550, 220);

                p.fill(100, 60, 40);
                p.rect(370, 300, 60, 90);

                p.fill(120, 200, 230);
                p.rect(305, 260, 45, 45);
                p.rect(450, 260, 45, 45);
            };

            
        }, 'Contoh_rumah');
        
    </script>
</body>
</html>
