<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop Grafika Komputer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
  </head>
  <body>

    <!-- Semua button untuk memilih project -->
    <button onclick="tampilkan('matahari')">Matahari</button>

    <div id="matahari"></div>
    <div id="pohon" style="display: none"></div>

    <div id="coin" style="display: none"></div>
    <div id="pedang" style="display: none"></div>
    <div id="alien" style="display: none"></div>

    <!-- Semua File Js -->
    <script src="./main.js"></script>
    <script src="./matahari.js"></script>
    <script src="./pohon.js"></script>
    <script src="./rumah.js"></script>
    <script src="./mobil.js"></script>
    <script src="./robot.js"></script>
